<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite" aria-atomic="true">
    <p id="status" role="status"></p>
    <div id="draft-result" hidden>
      <p><strong>Тема:</strong> <span id="topic"></span></p>
      <p><strong>Черновик ответа</strong></p>
      <pre id="draft"></pre>
      <p>Проверьте черновик перед отправкой клиенту.</p>
    </div>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = document.querySelector("button");
    const status = document.querySelector("#status");
    const draftResult = document.querySelector("#draft-result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    let busy = false;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;
      // A previous request's suggestion must never appear beside a new result.
      topic.textContent = "";
      draft.textContent = "";
      draftResult.hidden = true;
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      busy = true;
      button.disabled = true;
      message.disabled = true;
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5_000),
        });
        const data = await reply.json();
        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = "Введите непустой текст заявки.";
          return;
        }
        if (!reply.ok) throw new Error("Request failed");
        if (data?.status === "manual_review") {
          status.textContent = "AI не смог подготовить ответ. Разберите заявку вручную: определите тему и напишите ответ клиенту.";
          return;
        }
        if (
          data?.status !== "ready" || !Object.hasOwn(topics, data.topic) ||
          typeof data.draft !== "string" || !data.draft.trim()
        ) throw new Error("Invalid response");
        topic.textContent = topics[data.topic];
        draft.textContent = data.draft;
        draftResult.hidden = false;
        status.textContent = "Черновик готов.";
      } catch {
        status.textContent = "Не удалось получить ответ. Разберите заявку вручную: определите тему и напишите ответ клиенту.";
      } finally {
        busy = false;
        button.disabled = false;
        message.disabled = false;
      }
    });
  </script>
</body>
</html>
